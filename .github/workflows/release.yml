name: viewer

on:
  push:
    tags:
      - "wml*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
            archive: wml2viewer-windows-x86_64.zip
            legacy_archive: wml2viewer-windows.zip
            binary: wml2viewer.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            archive: wml2viewer-linux-x86_64.zip
            legacy_archive: wml2viewer-ubuntu-latest.zip
            binary: wml2viewer
          - os: macos-26
            target: aarch64-apple-darwin
            slug: macos-aarch64
            archive: wml2viewer-macos-aarch64.zip
            legacy_archive: ""
            binary: wml2viewer
          - os: macos-15-intel
            target: x86_64-apple-darwin
            slug: macos-x86_64
            archive: wml2viewer-macos-x86_64.zip
            legacy_archive: ""
            binary: wml2viewer

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: build wml2viewer
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package, dist | Out-Null
          Copy-Item README.* package/
          Copy-Item LICENSE package/
          Copy-Item resources/help.html package/
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/
          Compress-Archive -Path package/* -DestinationPath "dist/${{ matrix.archive }}"
          if ('${{ matrix.legacy_archive }}' -ne '') {
            Copy-Item "dist/${{ matrix.archive }}" "dist/${{ matrix.legacy_archive }}"
          }

      - name: package Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p package dist
          cp README.* LICENSE resources/help.html "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/
          (cd package && zip -q -j "../dist/${{ matrix.archive }}" *)
          if [ -n "${{ matrix.legacy_archive }}" ]; then
            cp "dist/${{ matrix.archive }}" "dist/${{ matrix.legacy_archive }}"
          fi

      - name: upload release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.slug }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*.zip
