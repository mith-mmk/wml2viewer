plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.mith_mmk.wml2viewer'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.mith_mmk.wml2viewer'
        minSdk 29
        targetSdk 35
        versionCode 18
        versionName '0.0.18-pre1'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; signingConfig null }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

def repositoryRoot = rootProject.projectDir.parentFile
def nativeOutput = file('src/main/jniLibs')
tasks.register('buildRustArm64', Exec) {
    workingDir repositoryRoot
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a', '-o', nativeOutput.absolutePath,
        'build', '--release', '--lib'
    inputs.files(fileTree(repositoryRoot) {
        include 'Cargo.toml', 'Cargo.lock', 'build.rs', 'src/**/*.rs', 'resources/**'
    })
    outputs.file(file('src/main/jniLibs/arm64-v8a/libwml2viewer.so'))
}
tasks.named('preBuild').configure { dependsOn tasks.named('buildRustArm64') }
