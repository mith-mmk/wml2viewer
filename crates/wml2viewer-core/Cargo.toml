[package]
name = "wml2viewer-core"
version = "0.0.29"
edition = "2024"
license = "MIT"
description = "Platform-independent image and reading-session core for wml2viewer"
publish = false

[features]
default = []
avif = ["wml2/avif"]

[dependencies]
bin-rs = { version = "0.1.0", features = ["util"] }
oxiarc-archive = "=0.3.6"
wml2 = { git = "https://github.com/mith-mmk/wml2-on-rust", rev = "3c256281dc5a4557fed49e209696be13922ce81d", features = ["multithread", "jpeg-xl", "color-management"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
oxiarc-lzhuf = "=0.3.6"
