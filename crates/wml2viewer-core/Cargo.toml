[package]
name = "wml2viewer-core"
version = "0.0.20"
edition = "2024"
license = "MIT"
description = "Platform-independent image and reading-session core for wml2viewer"
publish = false

[features]
default = []
avif = ["wml2/avif"]

[dependencies]
oxiarc-archive = "=0.3.6"
wml2 = { path = "../wml2", features = ["multithread"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
oxiarc-lzhuf = "=0.3.6"
